  if(x.grade)return {t:x.max?`${x.grade}/${x.max}`:x.grade,c:"ok"};
  const d=exDate(x);if(!d)return {t:"voto",c:"wait"};
  const n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),k=Math.round((d-d0)/864e5);
  if(k>1)return {t:`tra ${k} giorni`,c:""};if(k===1)return {t:"domani",c:""};if(k===0)return {t:"oggi",c:""};
  return {t:"voto",c:"wait"};
}
function exAvg(mods){
  const g=mods.filter(x=>exNum(x.grade)!==null);if(!g.length)return null;
  const maxes=[...new Set(g.map(x=>exNum(x.max)||30))];
  if(maxes.length===1){const m=maxes[0],v=g.reduce((a,x)=>a+exNum(x.grade),0)/g.length;return {t:`${fmtN(v)}/${fmtN(m)}`,n:g.length}}
  const v=g.reduce((a,x)=>a+exNum(x.grade)/(exNum(x.max)||30)*30,0)/g.length;return {t:`${fmtN(v)}/30`,n:g.length};
}
function exFormMod(x,subj){
  const n=!x,mods=exList().filter(y=>y.subj===subj&&y.kind!=="Materia"),last=mods[mods.length-1]||{};
  x=x||{id:"",subj,name:"",date:"",grade:"",max:"",note:""};
  const ph="Modulo "+(mods.length+1);
  return `<div class="exform">
    <label>Nome<input id="ex-name" value="${esc(x.name||"")}" autocomplete="off"></label>
    <div class="exrow"><label>Data<input id="ex-date" type="date" value="${esc(x.date||"")}"></label></div>
    ${n?"":`<div class="exrow"><label>Voto<input id="ex-grade" inputmode="decimal" value="${esc(x.grade||"")}"></label><label>Su<input id="ex-max" inputmode="decimal" value="${esc(x.max||"")}"></label></div><label>Nota<input id="ex-note" value="${esc(x.note||"")}"></label>`}
    <div class="row"><button class="btn" data-act="ex-save" data-ex="${esc(x.id)}" data-subj="${esc(subj)}" data-ph="${esc(ph)}">${n?"Aggiungi":"Salva"}</button><button class="btn glassbtn" data-act="ex-cancel">Annulla</button>${n?"":`<button class="btn glassbtn danger" data-act="ex-del" data-ex="${esc(x.id)}">Elimina</button>`}</div></div>`;
}
function exFormSub(nm){
  return `<div class="exform"><label>Nome esame<input id="ex-sn" value="${esc(nm)}" autocomplete="off"></label><div class="row"><button class="btn" data-act="ex-subsave" data-subj="${esc(nm)}">Salva</button><button class="btn glassbtn" data-act="ex-cancel">Annulla</button><button class="btn glassbtn danger" data-act="ex-subdel" data-subj="${esc(nm)}">Elimina</button></div></div>`;
}
let UNDOT=null;
function undoBar(msg,fn){
  let b=document.getElementById("undo");if(!b){b=document.createElement("div");b.id="undo";b.className="undo";document.body.appendChild(b)}
  b.innerHTML=`<span></span><button>Annulla</button>`;b.firstChild.textContent=msg;
  b.lastChild.onclick=()=>{fn();hideUndo()};
  requestAnimationFrame(()=>b.classList.add("on"));clearTimeout(UNDOT);UNDOT=setTimeout(hideUndo,6000);
}
function hideUndo(){clearTimeout(UNDOT);const b=document.getElementById("undo");if(b)b.classList.remove("on")}
function exDelete(items,msg){
  const ids=items.map(x=>x.id);
  items.forEach(x=>{x.x=1;x.u=Date.now()});store.set("ex",EXMS);touch();EXUI=null;render();
  undoBar(msg,()=>{ids.forEach(id=>{const x=EXMS.find(y=>y.id===id);if(x){delete x.x;x.u=Date.now()}});store.set("ex",EXMS);touch();render()});
}
function exCard(){
  const f="all",subs=[];
  exList().forEach(x=>{let g=subs.find(s=>s.n===x.subj);if(!g){g={n:x.subj,l:[],ids:[]};subs.push(g)}g.ids.push(x.id);if(x.kind!=="Materia")g.l.push(x)});
  subs.forEach(g=>g.l.sort((a,b)=>(exDate(a)||9e14)-(exDate(b)||9e14)));
  const vis=g=>g.l.filter(x=>f==="all"||(f==="done")===exDone(x));
  const key=g=>{const up=g.l.filter(x=>!exDone(x)).map(x=>+exDate(x)||9e14);if(up.length)return Math.min(...up);return g.l.length?9e15-Math.max(0,...g.l.map(x=>+exDate(x)||0)):9e14};
  const shown=subs.filter(g=>f==="all"||vis(g).length||(!g.l.length&&f==="todo")).sort((a,b)=>key(a)-key(b));
  if(!shown.length)return "";
  const row=(g,x)=>{
    const st=exStatus(x);
    if(EXUI==="q:"+x.id)return `<div class="exr quick"><span class="exn"><b>${esc(x.name)}</b></span><input id="q-g" inputmode="decimal" value="${esc(x.grade||"")}" aria-label="Voto"><span class="qs">su</span><input id="q-m" inputmode="decimal" value="${esc(x.max||(g.l.find(y=>y.max)||{}).max||"")}" aria-label="Su quanto"><button class="chip exo" data-act="q-save" data-ex="${esc(x.id)}">OK</button></div>`;
    return `<div class="exr ${exDone(x)?"fatto":""} ${x.id===EXFRESH?"fresh":""}"><button class="exe" data-act="ex-mopen" data-ex="${esc(x.id)}" ${x.id==="fond-m2"?"disabled":""}><span class="exn"><b>${esc(x.name)}</b>${x.note?`<i>${esc(x.note)}</i>`:""}</span><span class="exd">${esc(exFmt(x))}</span></button><button class="pill ex-${st.c} num" data-act="ex-q" data-ex="${esc(x.id)}" aria-label="Voto di ${esc(x.name)}">${esc(st.t)}</button></div>`};
  return shown.map(g=>{const av=exAvg(g.l),v=vis(g);
    return `<section class="glass card exg ${g.l.length&&g.l.every(exDone)?"allfatto":""} ${g.ids.includes(EXFRESH)&&!g.l.some(x=>x.id===EXFRESH)?"fresh":""}"><div class="exh"><button class="exopen" data-act="ex-open" data-subj="${esc(g.n)}" ${g.l.some(x=>x.id==="fond-m2")?"disabled":""}><h2>${esc(g.n)}</h2>${av&&av.n>1?`<span class="exav num">Media ${esc(av.t)}</span>`:""}</button><button class="exp" data-act="ex-mod" data-subj="${esc(g.n)}" aria-label="Aggiungi un modulo a ${esc(g.n)}"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>${EXUI==="s:"+g.n?exFormSub(g.n):""}${EXUI==="m:"+g.n?exFormMod(null,g.n):""}${v.map(x=>row(g,x)).join("")}</section>`}).join("");
}
function vEsami(){
  const f=SETT.exf||"todo";
  return `<header class="top"><div><h1>Esami</h1></div><div class="hr"><button class="themebtn" data-act="theme" aria-label="Cambia tema">${THEMEICO()}</button></div></header>
  
  <div class="stack exgrid">${EXUI==="new"?`<section class="glass card exg fresh"><div class="exform"><label>Nuovo esame<input id="ex-subj" autocomplete="off"></label><div class="row"><button class="btn" data-act="ex-save" data-ex="" data-subj="">Aggiungi</button><button class="btn glassbtn" data-act="ex-cancel">Annulla</button></div></div></section>`:`<button class="exghost" data-act="ex-new" aria-label="Nuovo esame"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="gl">Nuovo esame</span></button>`}${exCard()}</div>`;
}
function vMateria(){
  const mx=MODID&&EXMS.find(y=>y.id===MODID&&!y.x);
  if(mx)return `<header class="top"><div><h1>${esc(mx.name||"Modulo")}</h1></div><div class="hr"><button class="subjchip" data-act="ex-cancel"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>Esami</button><button class="themebtn" data-act="theme" aria-label="Cambia tema">${THEMEICO()}</button></div></header>
  <div class="stack"><section class="glass card"><p class="muted">Nessun materiale di studio.</p></section></div>`;
  return `<header class="top"><div><h1>${esc(SUBJ||"")}</h1></div><div class="hr"><button class="subjchip" data-go="esami"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>Esami</button><button class="themebtn" data-act="theme" aria-label="Cambia tema">${THEMEICO()}</button></div></header>
  <div class="stack"><section class="glass card"><p class="muted">Nessun materiale di studio.</p></section></div>`;
}
function focusMdl(){setTimeout(()=>{const i=document.querySelector(".exform input");if(i&&!i.value)try{i.focus({preventScroll:true})}catch(_){}},60)}
function exRead(id,subj){
  const v=i=>(document.getElementById(i)||{}).value||"";
  if(!id&&subj===""){const nm=v("ex-subj").trim();if(!nm){const f=document.getElementById("ex-subj");if(f)f.focus();return}
    exSave({id:"x"+Date.now().toString(36),subj:nm,kind:"Materia",name:"",date:"",grade:"",max:"",note:""});EXUI=null;render();return}
  const old=EXMS.find(y=>y.id===id)||{};
  exSave({id:id||("x"+Date.now().toString(36)),subj,kind:"Modulo",name:v("ex-name").trim()||(old.name)||(document.querySelector('[data-act="ex-save"]')||{dataset:{}}).dataset.ph||"Modulo",date:v("ex-date"),grade:id?v("ex-grade").trim():"",max:id?v("ex-max").trim():"",note:id?v("ex-note").trim():""});
  EXUI=null;render();
}
function qSave(id){
  const x=EXMS.find(y=>y.id===id);if(!x)return;
  const g=(document.getElementById("q-g")||{}).value||"",m=(document.getElementById("q-m")||{}).value||"";
  exSave(Object.assign({},x,{grade:g.trim(),max:m.trim()}));EXUI=null;render();
}
function impPanel(){
  const note="";
  const msg=SYNC.impMsg?`<p class="small">${esc(SYNC.impMsg)}</p>`:"";
  if(!SYNC.showImp)return msg?`<div class="stack-s">${msg}</div>`:"";
  return `<section class="glass card">${note}<span class="eyebrow">Importa progressi</span><h2>Incolla il codice</h2><p class="small">Nella vecchia app tocca «Copia i miei progressi» e incolla qui. I progressi si uniscono a quelli che hai già: non viene cancellato niente.</p><textarea id="impbox" rows="3" style="width:100%;margin:8px 0;font:inherit"></textarea>${msg}<div class="row"><button class="btn" data-act="imp-go">Importa</button><button class="btn glassbtn" data-act="imp-toggle">Chiudi</button></div></section>`;
}

/* ---------- eventi ---------- */
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target&&e.target.tagName==="INPUT"&&e.target.closest&&e.target.closest(".exform")){const b=e.target.closest(".exform").querySelector(".btn:not(.glassbtn)");if(b){e.preventDefault();b.click()}return}if(e.key==="Enter"&&e.target&&(e.target.id==="q-g"||e.target.id==="q-m")){const b=document.querySelector('[data-act="q-save"]');if(b)qSave(b.dataset.ex)}});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-act],[data-topic],[data-sheet],[data-fc],[data-set],[data-calc],[data-rev],[data-ftop],[data-trap],[data-trapt],[data-studio],[data-src],[data-corso],[data-pool],[data-nu],[data-ord],[data-exf]");
  if(!t)return;
  const D=t.dataset;
  if(D.act&&D.act.startsWith("ex-")){
    if(D.act==="ex-new"){EXUI="new";render();focusMdl();return}
    else if(D.act==="ex-mopen"){if(D.ex==="stat-p1"){go("piano")}else{const x=EXMS.find(y=>y.id===D.ex);if(x){MODID=x.id;SUBJ=x.subj;go("materia")}}return}
    else if(D.act==="ex-cancel"){EXUI=null;if(MODID){MODID=null;go("esami")}else render();return}
    else if(D.act==="ex-mod"){const used=new Set(exList().filter(y=>y.subj===D.subj).map(y=>y.name)),mods=exList().filter(y=>y.subj===D.subj);let k=1;while(used.has("Modulo "+k))k++;exSave({id:"x"+Date.now().toString(36),subj:D.subj,kind:"Modulo",name:"Modulo "+k,date:"",grade:"",max:"",note:""});EXUI=null;render();return}
    else if(D.act==="ex-save"){exRead(D.ex,D.subj);if(MODID){MODID=null;go("esami")}return}
    else if(D.act==="ex-q"){EXUI=EXUI==="q:"+D.ex?null:"q:"+D.ex}
    else if(D.act==="q-save"){qSave(D.ex);return}
    else if(D.act==="ex-sub"){EXUI=EXUI==="s:"+D.subj?null:"s:"+D.subj;render();return}
    else if(D.act==="ex-subsave"){const nm=((document.getElementById("ex-sn")||{}).value||"").trim();if(nm&&nm!==D.subj)EXMS.filter(y=>!y.x&&y.subj===D.subj).forEach(y=>exSave(Object.assign({},y,{subj:nm})));EXUI=null;render();return}
    else if(D.act==="ex-subdel"){const it=EXMS.filter(y=>!y.x&&y.subj===D.subj);exDelete(it,`«${D.subj}» eliminato`);return}
    else if(D.act==="ex-open"){if(EXMS.some(y=>!y.x&&y.subj===D.subj&&y.id==="stat-p1")){go("piano")}else{MODID=null;SUBJ=D.subj;go("materia")}return}
    else if(D.act==="ex-del"){const x=EXMS.find(y=>y.id===D.ex);if(x)exDelete([x],`«${x.name||"Modulo"}» eliminato`);else{EXUI=null;render()}if(MODID){MODID=null;go("esami")}return}
    render();return}
  if(D.exf){SETT.exf=D.exf;store.set("sett",SETT);EXUI=null;render();return}
  if(D.go){go(D.go);return}
  if(D.nu!==undefined){SETT.nu=D.nu==="1";store.set("sett",SETT);render();return}
  if(D.ord){SETT.ord=D.ord;store.set("sett",SETT);render();return}
  if(D.src){startSession(fl(srcQs(D.src)).map(q=>q.id),D.src);return}
  if(D.corso){startSession(fl(corsoTop(D.corso)).map(q=>q.id),"Esercizi del corso · "+TOPMAP[D.corso].short);return}
  if(D.pool){SETT.pool=D.pool;store.set("sett",SETT);const g=t.parentElement;if(g)g.querySelectorAll("[data-pool]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.pool===D.pool||(D.pool!=="tutte"&&b.dataset.pool==="corso"))));return}
  if(D.topic){startSession(shuffle(fl(topQs(D.topic))).map(q=>q.id),TOPMAP[D.topic].name);return}
  if(D.sheet){openSheet=D.sheet;studioTab="schede";go("studio");const el=document.getElementById("sheet-"+D.sheet);if(el)el.scrollIntoView({block:"start"});return}
  if(D.fc){FCS={top:D.fc,only:false,idx:0,flip:false,deck:null};go("flash");return}
  if(D.studio){studioTab=D.studio;if(view!=="studio")go("studio");else render();return}
  if(D.trapt){studioTab="trappole";go("studio");return}
  if(D.set){SETT[D.set]=!SETT[D.set];store.set("sett",SETT);t.setAttribute("aria-pressed",String(!!SETT[D.set]));return}
  if(D.calc){const k=D.calc[0],up=D.calc[1]==="+";calc[k]=Math.max(0,Math.min(SIM_N,calc[k]+(up?1:-1)));if(calc.g+calc.w>SIM_N){if(k==="g")calc.w=SIM_N-calc.g;else calc.g=SIM_N-calc.w}const c=document.querySelector(".calc");if(c)c.outerHTML=calcHTML();return}
  if(D.rev){revFilter=D.rev;render();return}
  if(D.ftop){FCS={top:D.ftop,only:FCS.only,idx:0,flip:false,deck:null};render();return}
  if(D.trap!==undefined){const tr=TRAPS[+D.trap];startSession(shuffle(tr.q.filter(id=>BYID[id])),tr.t);return}
  switch(D.act){
    case "theme":THEME=isDark()?"light":"dark";store.set("theme",THEME);applyTheme();render();break;
    case "start-sim":revFilter="all";startSim();break;
    case "start-focus":startFocus();break;
    case "start-real":startSession(shuffle(fl(QS.filter(q=>q.real))).map(q=>q.id),"Prove ed esercizi del corso");break;
    case "start-prove":startSession(["Esempio prova intermedia","Intermedia 2015","Intermedia 2016","Esame 2021"].flatMap(s=>srcQs(s).map(q=>q.id)),"Prove degli anni passati");break;
    case "start-all":startSession(shuffle(fl(QS)).map(q=>q.id),"Tutte le domande");break;
    case "start-err":startSession(shuffle(Object.keys(ERR).filter(id=>BYID[id])),"Solo errori");break;
    case "pick":pick(+D.d);break;
    case "next":if(SES.i<SES.ids.length-1){SES.i++;render();window.scrollTo(0,0)}break;
    case "prev":if(SES.i>0){if(SES.kind==="sim"&&SES.secOf[SES.i-1]<SES.closed)break;SES.i--;render();window.scrollTo(0,0)}break;
    case "skip":if(SES.i<SES.ids.length-1){SES.i++;render();window.scrollTo(0,0)}else finish();break;
    case "jump":{const k=+D.k;if(SES.kind==="sim"&&SES.secOf[k]!==SES.secOf[SES.i])break;SES.i=k;render();window.scrollTo(0,0);break}
    case "finish":finish();break;
    case "ask-sec":SES.ask="sec";render();break;
    case "cancel-ask":SES.ask=null;render();break;
    case "confirm-sec":closeSection();break;
    case "ask-exit":SES.exit=true;render();break;
    case "cancel-exit":SES.exit=false;render();break;
    case "confirm-exit":leave();break;
    case "leave":leave();break;
    case "again":{const ids=shuffle(SES.ids),title=SES.title;revFilter="all";startSession(ids,title);break}
    case "flip":FCS.flip=!FCS.flip;{const f=document.querySelector(".flip");if(f)f.classList.toggle("back",FCS.flip)}break;
    case "fonly":FCS.only=!FCS.only;FCS.deck=null;FCS.idx=0;FCS.flip=false;render();break;
    case "fshuf":FCS.deck=shuffle(deck());FCS.idx=0;FCS.flip=false;render();break;
    case "fprev":{const d=deck();if(!d.length)break;FCS.idx=(FCS.idx-1+d.length)%d.length;FCS.flip=false;render();break}
    case "fnext":{const d=deck();if(!d.length)break;FCS.idx=(FCS.idx+1)%d.length;FCS.flip=false;render();break}
    case "fknow":case "frev":{const d=deck(),c=d[FCS.idx];if(!c)break;FCK[fcId(c)]=D.act==="fknow"?"k":"r";store.set("fc",FCK);touch();
      if(FCS.only&&D.act==="fknow"){FCS.deck=null;FCS.flip=false;render();break}
      FCS.idx=(FCS.idx+1)%d.length;FCS.flip=false;render();break}
    case "imp-toggle":SYNC.showImp=!SYNC.showImp;SYNC.impMsg="";softRender();break;
    case "imp-go":importFromBox();break;
  }
});
document.addEventListener("change",e=>{
  const p=e.target.closest("[data-plan]");
  if(!p)return;
  PLANCHK[p.dataset.plan]=p.checked;store.set("plan",PLANCHK);touch();
  const y=window.scrollY,key=p.dataset.plan,on=p.checked;render();window.scrollTo(0,y);
  if(on){const n=document.querySelector('[data-plan="'+key+'"]');if(n)n.classList.add("pop")}
});
document.addEventListener("keydown",e=>{
  if(view==="quiz"&&SES&&!SES.done&&!SES.ask&&!SES.exit){const q=BYID[SES.ids[SES.i]],k=q.vf?"vf".indexOf(e.key.toLowerCase()):"abcd".indexOf(e.key.toLowerCase());if(k>=0&&k<q.opts.length){pick(k);e.preventDefault()}}
});
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(VIEWS.includes(v)&&v!==view){view=v;render()}});
initSync();
try{if("serviceWorker" in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}catch(e){}
})();

</script>
